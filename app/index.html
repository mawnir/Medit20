<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meditation20 · Twenty Minutes of Daily Stillness</title>
    <meta
      name="description"
      content="A quiet sanctuary for daily meditation. Four sequential courses, each timed to twenty minutes."

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e12" media="(prefers-color-scheme: dark)" />

    <script>
      // Set before first paint so the page never flashes the wrong mode.
      try {
        var t = localStorage.getItem('cm:theme') || localStorage.getItem('meditaiton20-theme')
        if (!t) t = 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
